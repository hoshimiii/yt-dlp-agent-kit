name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_fixture:
        description: "Run fixed public W3C <=5 MiB download smoke test"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/sync_dsh_assets.py --check
      - run: npm ci --ignore-scripts --prefix adapters/dsh
      - name: Test native DSH registries and Python bridge
        shell: bash
        run: |
          export YTAGENT_TEST_PYTHON="$(uv run --frozen python -c 'import sys; print(sys.executable)')"
          npm test --prefix adapters/dsh
      - run: uv build
      - run: npm pack --ignore-scripts
        working-directory: adapters/dsh
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/smoke_live.py --download
